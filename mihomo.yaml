  - { <<: *service, name: YouTube }
  - { <<: *service, name: Disney }
  - { <<: *service, name: Netflix }
  - { <<: *service, name: HBO }
  - { <<: *service, name: Spotify }
  - { <<: *service, name: Crypto }
  - { <<: *service, name: Amazon }
  - { <<: *service, name: Apple }
  - { <<: *service, name: Microsoft }
  - { <<: *service, name: Google }
  - { <<: *service, name: Test }
  - { <<: *service, name: 国内, proxies: [DIRECT, 所有-手动, 所有-自动, 香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 其他-自动, REJECT] }
  - { <<: *service, name: 国外, proxies: [所有-自动, 所有-手动, 香港-自动, 台湾-自动, 日本-自动, 新加坡-自动, 韩国-自动, 美国-自动, 其他-自动, DIRECT, REJECT] }

